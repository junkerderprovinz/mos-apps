[extend]
useDefault = true

# Templates name their environment variables under "key", which the generic
# key rule reads as a secret, and the CouchDB setup steps show `curl -u
# admin:PASS` with a placeholder.
[[allowlists]]
description = "variable names and placeholders in templates"
condition = "AND"
paths = ['''^docker/[^/]+\.json$''']
regexes = ['''^[A-Z][A-Z0-9_]*$''', '''^admin:PASS$''']
